<!doctype html>
<html lang="es" style="background:#121212;">
<head>
<meta charset="utf-8">
<title>Reproductores</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reproductores">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #121212; overflow: hidden; }
  /* iOS Safari ignora width:100% en un iframe y lo AGRANDA al ancho de su
     contenido: si algo adentro se pasa un pixel, el iframe entero queda más
     ancho que la pantalla y hay que alejar con los dedos. width:1px +
     min-width:100% es el truco conocido que lo obliga a medir exactamente
     el ancho de la pantalla. top con safe-area: en modo app instalada la
     barra de estado del iPhone es translúcida y tapaba el encabezado. */
  iframe {
    position: fixed; left: 0; top: 0; top: env(safe-area-inset-top, 0px);
    width: 1px; min-width: 100%; max-width: 100%;
    height: 100%; height: calc(100% - env(safe-area-inset-top, 0px));
    border: 0; background: #121212; z-index: 1;
  }

  /* El login vive ACÁ, no adentro del iframe: esta página es estática (no
     depende de que carguen Tailwind, fuentes ni gráficos), así que puede
     mostrarse al instante después de la foto — a diferencia de esperar al
     evento "load" del iframe, que casi siempre tarda más de 1-3 segundos
     por esos recursos externos, y ahí es donde antes se colaba el camarón.
     Por eso el login queda ENCIMA del iframe (z-index más alto), tapándolo
     por completo — pero el iframe SÍ está cargando la app real desde el
     primer instante, atrás de esa tapa, aprovechando cada milisegundo que
     la persona tarda en escribir su cédula. Así, cuando manda el
     formulario, Tailwind/fuentes/gráficos ya están descargados por el
     navegador y el caché del servidor ya está tibio (precalentarCache()),
     en vez de arrancar todo eso recién en ese momento. */
  #intro {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
    background: #121212; transition: opacity .4s;
  }
  #intro img { width: clamp(48px, 18vw, 84px); height: clamp(48px, 18vw, 84px); border-radius: 20%; object-fit: cover; }
  #intro.oculto { opacity: 0; pointer-events: none; }

  #login {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 3; opacity: 1;
    display: flex; align-items: center; justify-content: center;
    background: #0E1117; transition: opacity .4s;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px; box-sizing: border-box;
  }
  #login.oculto { opacity: 0; pointer-events: none; }
  #login .caja { width: 100%; max-width: 340px; }
  #login h1 { color: #F1F1F4; font-size: 20px; font-weight: 800; text-align: center; margin: 0 0 28px; letter-spacing: .01em; }
  #login .campo { display: flex; align-items: center; gap: 10px; background: #1F2530; border-radius: 999px; padding: 6px 8px 6px 6px; margin-bottom: 14px; }
  #login .campo .icono { width: 34px; height: 34px; border-radius: 999px; background: #F1F1F4; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #login input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F1F1F4; font-size: 16px; letter-spacing: .04em; }
  #login input::placeholder { color: #6B7280; letter-spacing: normal; }
  #login button { width: 100%; margin-top: 10px; background: #F1F1F4; color: #14181F; border: 0; border-radius: 999px; padding: 14px; font-size: 14px; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
  #login button:active { transform: scale(.98); }
  #login .error { color: #FF6B5B; font-size: 12px; text-align: center; margin-top: 10px; min-height: 14px; }
</style>
</head>
<body>

<iframe id="app" src="https://script.google.com/macros/s/AKfycby_yY9d85MFWQcspabnS50Hg62GkYzX_77zS05O55WjjSy7KOYoj5L1OioEtUi5do7B/exec" allow="clipboard-write; fullscreen"></iframe>

<div id="intro">
  <img src="intro.jpg" alt="">
</div>

<div id="login">
  <div class="caja">
    <h1>REPRODUCTORES</h1>
    <form id="formLogin" autocomplete="off">
      <div class="campo">
        <span class="icono">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14181F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input id="inpCedula" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="N° de cédula" maxlength="10">
      </div>
      <button type="submit" id="btnLogin">INGRESAR</button>
      <p class="error" id="loginError"></p>
    </form>
  </div>
</div>

<script>
  // El iframe YA está cargando la app real desde que se abrió la página
  // (ver el src puesto directo arriba) — mientras la persona ve la foto y
  // después escribe su cédula acá, atrás ya se están descargando
  // Tailwind/fuentes/Chart.js y ya se disparó precalentarCache() (adentro
  // de Index.html) para calentar el caché del servidor. Al mandar el
  // formulario, se recarga el mismo iframe agregándole la cédula — esa
  // segunda carga reaprovecha lo que el navegador ya descargó, así que
  // sale mucho más rápido que si recién ahí arrancara todo de cero.
  var URL_APP_ = document.getElementById('app').src.split('?')[0];

  var inpCedula_ = document.getElementById('inpCedula');
  setTimeout(function () {
    var el = document.getElementById('intro');
    if (el) el.className = 'oculto';
    // Cursor listo en el campo apenas aparece el login. En Android/PC esto
    // ya abre el teclado; iPhone NO permite abrir el teclado sin un toque
    // (regla de Apple), por eso además cualquier toque en esta pantalla
    // lleva directo al campo con el teclado numérico.
    try { inpCedula_.focus(); } catch (e) {}
  }, 1000);
  document.getElementById('login').addEventListener('touchend', function (ev) {
    if (ev.target.closest && (ev.target.closest('button') || ev.target === inpCedula_)) return;
    inpCedula_.focus();
  });

  document.getElementById('formLogin').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var cedula = document.getElementById('inpCedula').value.trim();
    var errorEl = document.getElementById('loginError');
    if (!/^\d{10}$/.test(cedula)) {
      errorEl.textContent = 'Ingresa los 10 dígitos de tu cédula.';
      return;
    }
    errorEl.textContent = '';
    document.getElementById('btnLogin').disabled = true;
    inpCedula_.blur(); // oculta el teclado apenas se aprieta INGRESAR

    // a partir de acá, todo lo que se vea (verificar la cédula, BIENVENIDO,
    // el camarón si hace falta esperar los datos) lo maneja el propio
    // dashboard, adentro del iframe — ya con su cédula puesta en la URL
    document.getElementById('app').src = URL_APP_ + '?cedula=' + encodeURIComponent(cedula);
    document.getElementById('login').className = 'oculto';
  });
</script>

</body>
</html>
