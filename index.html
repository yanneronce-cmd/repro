<!doctype html>
<html lang="es" style="background:#121212;">
<head>
<meta charset="utf-8">
<title>Reproductores</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reproductores">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #121212; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #121212; }

  #carga, #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #121212; color: #9C9CA8;
    font-family: sans-serif; font-size: 13px;
    transition: opacity .4s;
  }
  #carga img, #intro img { width: clamp(48px, 18vw, 84px); height: clamp(48px, 18vw, 84px); border-radius: 20%; object-fit: cover; }
  #carga { z-index: 2; }
  #intro { z-index: 3; }
  #carga.oculto, #intro.oculto { opacity: 0; pointer-events: none; }

  /* Latido lento en el ícono de carga, para que se note que sigue trabajando
     y no que la pantalla se quedó pegada — sobre todo ahora que carga tres
     cosas (Control de Lotes, Consumos, Salas Activas) y puede tardar más. */
  #carga img { animation: latido 1.8s ease-in-out infinite; }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
</style>
</head>
<body>

<div id="intro">
  <img src="intro.jpg" alt="">
</div>

<div id="carga">
  <img src="icon-192.png" alt="">
  <span>Cargando Reproductores…</span>
</div>

<iframe id="app" src="https://script.google.com/macros/s/AKfycby_yY9d85MFWQcspabnS50Hg62GkYzX_77zS05O55WjjSy7KOYoj5L1OioEtUi5do7B/exec" allow="clipboard-write; fullscreen"></iframe>

<script>
  setTimeout(function () {
    var el = document.getElementById('intro');
    if (el) el.className = 'oculto';
  }, 1000);

  // La pantalla de "Cargando…" ya NO se oculta solo porque el iframe terminó
  // de cargar su HTML — eso pasa rápido pero adentro sigue pidiendo datos
  // (Control de Lotes, Consumos, Salas Activas). Se oculta recién cuando el
  // propio dashboard avisa "listo" por postMessage. Si por algo esa señal
  // nunca llega, el timeout de respaldo la oculta igual a los 20s para que
  // no se quede pegada para siempre.
  window.addEventListener('message', function (ev) {
    if (ev.data === 'reproductores:listo') {
      document.getElementById('carga').className = 'oculto';
    }
  });
  setTimeout(function () {
    document.getElementById('carga').className = 'oculto';
  }, 20000);
</script>

</body>
</html>
